name: DevSecOps Basic Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sast:
    name: SAST Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.9.4
      - name: Detectar credenciales y errores de seguridad
        run: bandit -r app.py -f txt
  sca:
    name: SCA Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install safety==2.3.5
      - name: Analizar dependencias con Safety
        run: safety check -r requirements.txt --full-report
  audit:
    name: SCA pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Verificar dependencias directas y transitivas
        run: pip-audit -r requirements.txt --aliases
